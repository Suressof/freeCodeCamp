<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback Survey</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="title">Customer Feedback Survey</h1>
            <p id="description">We value your opinion! Please take a few minutes to share your experience with us.</p>
        </header>
        
        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name" class="required">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label id="email-label" for="email" class="required">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>
            
            <div class="form-group">
                <label id="number-label" for="number">Age (Optional)</label>
                <input type="number" id="number" name="age" min="13" max="120" placeholder="Enter your age">
            </div>
            
            <div class="form-group">
                <label for="dropdown">How did you hear about us?</label>
                <select id="dropdown" name="referral">
                    <option value="" disabled selected>Select an option</option>
                    <option value="social-media">Social Media</option>
                    <option value="friend">Friend or Family</option>
                    <option value="advertisement">Advertisement</option>
                    <option value="search-engine">Search Engine</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>How satisfied are you with our service?</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="very-satisfied" name="satisfaction" value="very-satisfied">
                        <label for="very-satisfied">Very Satisfied</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="satisfied" name="satisfaction" value="satisfied">
                        <label for="satisfied">Satisfied</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="neutral" name="satisfaction" value="neutral">
                        <label for="neutral">Neutral</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="dissatisfied" name="satisfaction" value="dissatisfied">
                        <label for="dissatisfied">Dissatisfied</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="very-dissatisfied" name="satisfaction" value="very-dissatisfied">
                        <label for="very-dissatisfied">Very Dissatisfied</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>What could we improve? (Select all that apply)</label>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <input type="checkbox" id="improve-customer-service" name="improvements" value="customer-service">
                        <label for="improve-customer-service">Customer Service</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="improve-product-quality" name="improvements" value="product-quality">
                        <label for="improve-product-quality">Product Quality</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="improve-pricing" name="improvements" value="pricing">
                        <label for="improve-pricing">Pricing</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="improve-website" name="improvements" value="website">
                        <label for="improve-website">Website Experience</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="improve-delivery" name="improvements" value="delivery">
                        <label for="improve-edlivery">Delivery Speed</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="comments">Additional Comments</label>
                <textarea id="comments" name="comments" placeholder="Please share any additional feedback or suggestions..."></textarea>
            </div>
            
            <button type="submit" id="submit">Submit Survey</button>
        </form>
    </div>
</body>
</html>
