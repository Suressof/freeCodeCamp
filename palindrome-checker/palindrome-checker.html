<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Palindrome Checker</h1>
        <p class="description">A palindrome reads the same forwards and backwards, ignoring punctuation, case, and spacing.</p>
        
        <div class="input-group">
            <input type="text" id="text-input" placeholder="Enter text to check...">
            <button id="check-btn">Check</button>
        </div>
        
        <div id="result">Your result will appear here</div>
        
        <div class="examples">
            <h3>Examples</h3>
            <ul>
                <li class="palindrome-example">eye, race car, A man, a plan, a canal. Panama</li>
                <li class="not-palindrome-example">not a palindrome, nope, almostomla</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
